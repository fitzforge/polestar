[package]
name = "forge-world"
description = "Game data, prerequisites, solo filter, availability, camps, areas, the quest atlas, the world builder."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = ["native"]
# File-system loaders (World::load, GameData::load_dir). Off for wasm, which hands in bytes.
native = ["dep:flate2"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
rustc-hash.workspace = true
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
forge-core = { path = "../forge-core" }
flate2 = { version = "1", optional = true }

[lints]
workspace = true
