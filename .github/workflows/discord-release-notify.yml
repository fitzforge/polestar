name: Discord release notes

# A release is published: every issue filed from the Discord #bugs forum and
# closed as completed since the full release before it gets "the fix is out
# in <release>" in its thread and the label released:<tag>, so a re-run never
# tells a thread twice; so does each one from Discord closed as a duplicate
# of an issue the release ships. A prerelease (v0.3.0-rc.1) tells no thread: it
# the tester role in the testers channel once, with the player entries from
# the tag's changes/. tools/discord-bot/README.md has the setup.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce again (threads and testers already told are skipped)
        required: true

permissions:
  contents: read

concurrency:
  group: discord-release

jobs:
  notify:
    name: Tell the threads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # The default branch's bot, not the tag's: a patch tag is cut from an
      # older release and carries the bot as it was then.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/discord-bot
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # A manual run stands in the release event for the tag it is given.
      - name: Release event
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '{release: .}' > "$RUNNER_TEMP/release.json"
          echo "NOTIFY_EVENT_PATH=$RUNNER_TEMP/release.json" >> "$GITHUB_ENV"

      - name: Notify
        run: node tools/discord-bot/notify.js release
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_FORUM_ID: ${{ vars.DISCORD_FORUM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_TESTERS_CHANNEL_ID: ${{ vars.DISCORD_TESTERS_CHANNEL_ID }}
          DISCORD_TESTER_ROLE_ID: ${{ vars.DISCORD_TESTER_ROLE_ID }}
