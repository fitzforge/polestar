name: Forge

# The Rust pipeline (rust/): format, lints, tests, the minimum Rust version, the wasm32 build of
# the crates the addon's browser tools use, and release builds of the forge binary on Linux,
# Windows and macOS (on pushes to main and next and on tags only, not on pull requests: they test
# nothing the check job doesn't, and the Windows build added 10-15 minutes to every pull request). A
# tag `forge-v*` also attaches the builds to a GitHub release. push and
# pull_request only: a pull request's code never runs with this repository's secrets or write token.
# The addon's Lua tests (forge-addontest: addon/ on the client stub tests/lua) read the addon, the
# stub, the guides and the committed data (data/, forever-db/); they run from one set of test
# binaries in four shards at once. The binaries are cached by the code they are built from, so a
# pull request that changes no Rust runs the ones next's run built and builds none.
# Every pull request and merge group (the merge queue's run on top of next, docs/CI.md "Merge queue")
# runs this workflow: "Format, lints, tests" is a required check, so it always reports.
# The lane job decides from the base branch's copy of tools/ci-lane.js (a pull request cannot pick its
# own lane): `run` for Rust, the compiler's fixtures and the documents the Rust tests read (RUST_PATHS)
# runs everything; `addon` for the rest of what the suites read (FORGE_PATHS: the addon, the guides,
# the data) runs the addon's Lua tests alone; `skip` for anything else passes the check at once. Every
# push runs everything, on the same paths (the push paths below are FORGE_PATHS; tests/ci-lane.test.js
# holds them equal).
# ci.yml builds forge on every push and on every pull request but a documentation-only one.
on:
  push:
    branches: [main, next]
    tags: ["forge-v*"]
    paths: ["rust/**", "addon/**", "data/**", "forever-db/**", "guides/**", "tests/lua/**", "tests/fixtures/dsl/**", "docs/FORGE.md", "docs/forge/**", "docs/API.md", "docs/GUIDE_FORMAT.md", "docs/PACK_FORMAT.md", "docs/PACKS.md", "README.md", "THIRD_PARTY.md", ".github/workflows/forge.yml"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Timing budgets (forge-addontest's assert_timing!) only warn on GitHub's shared runners; the release
  # gate enforces them on a quiet machine (docs/RELEASING.md, step 3).
  POLESTAR_TIMING_BUDGETS: warn

defaults:
  run:
    working-directory: rust

jobs:
  # The lane: `forge=run`, `forge=addon` or `forge=skip`, from the base's own copy of the lane script
  # (and testsel's mapping it reads), so a pull request cannot choose. Every push, and a base without
  # the script, runs everything.
  lane:
    name: Forge lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      forge: ${{ steps.lane.outputs.forge }}
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      # Two commits: a pull request's merge commit and the base it merges into, whose difference is
      # what the pull request changes. A merge group's base (next's tip) is fetched on its own.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Lane
        id: lane
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          changed="$RUNNER_TEMP/changed.txt" base="$RUNNER_TEMP/base" from=
          case "$EVENT" in
            pull_request) from=$(git rev-parse HEAD^1) || from= ;;
            merge_group) git fetch --no-tags --quiet --depth=1 origin "$GROUP_BASE" && from=$GROUP_BASE ;;
          esac
          if [ -n "$from" ] && git diff --no-renames --name-only "$from" HEAD > "$changed" \
            && git worktree add --detach --quiet "$base" "$from" && [ -f "$base/tools/ci-lane.js" ]; then
            node "$base/tools/ci-lane.js" --forge --github --files "$changed"
          else
            echo "forge=run" >> "$GITHUB_OUTPUT"
            printf '## Forge lane: run\n\n- %s\n' "$EVENT: every check" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Format, Clippy, the Rust tests but the addon's Lua tests (the addontest jobs run those) and the
  # documented commands: Rust changes only.
  rust:
    name: Rust suites
    needs: lane
    if: needs.lane.outputs.forge == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      # The quick profile (release without LTO, rust/Cargo.toml): optimised tests without the
      # link-time optimisation the shipped binaries get; much faster to build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --profile quick --locked -- -D warnings

      # A fresh clone has no game client, no built data/forever and no local reference data: the
      # tests that need them are #[ignore]d with the input they need named.
      - name: Test
        run: cargo test --profile quick --workspace --locked --exclude forge-addontest

      # Every command's --help and every docs/FORGE.md, docs/forge/*.md block marked `<!-- ci -->`.
      - name: Documented commands
        run: |
          cargo build --profile quick --locked -p forge
          scripts/doc-commands.sh target/quick/forge

  # forge-addontest's test binaries (its unit tests, addontest, scenes), cached by the code they are
  # built from: rust/ and the stub's simulate.lua, which they embed (the tests read the data and the
  # guides when they run). A hit (any pull request that changes neither, once next's run has built
  # them) builds nothing. A miss builds them; pushes save them for the pull requests after.
  addontest-bin:
    name: Addon tests build
    needs: lane
    if: needs.lane.outputs.forge == 'run' || needs.lane.outputs.forge == 'addon'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Cache key
        id: key
        run: echo "key=addontest-bin-${{ runner.os }}-${{ hashFiles('rust/**', 'tests/lua/simulate.lua') }}" >> "$GITHUB_OUTPUT"

      - name: Test binaries (cache)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/addontest-bin
          key: ${{ steps.key.outputs.key }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          workspaces: rust
          key: addontest

      # The executables cargo test would run, each under its target's name (forge_addontest: the unit
      # tests; addontest; scenes).
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo test --profile quick --locked -p forge-addontest --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null) | "\(.target.name)\t\(.executable)"' > "$RUNNER_TEMP/bins.tsv"
          mkdir -p target/addontest-bin
          while IFS=$'\t' read -r name exe; do cp "$exe" "target/addontest-bin/$name"; done < "$RUNNER_TEMP/bins.tsv"
          ls -la target/addontest-bin
          test -x target/addontest-bin/addontest

      - name: Test binaries (save)
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/addontest-bin
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: addontest-bin
          path: rust/target/addontest-bin
          retention-days: 1
          if-no-files-found: error

  # The addon's Lua tests in four shards: the crate's unit tests and the scenes in the first (about three
  # minutes on their own), addontest's tests dealt out in turn (its --list order) over the other three. Run
  # from the crate's folder, as cargo test does.
  addontest:
    name: Addon tests ${{ matrix.shard }}/4
    needs: [lane, addontest-bin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: rust/crates/forge-addontest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: addontest-bin
          path: rust/target/addontest-bin

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bin=../../target/addontest-bin
          chmod +x "$bin"/*
          if [ "$SHARD" = 1 ]; then
            for t in "$bin"/*; do
              case "${t##*/}" in addontest) ;; *) "$t" ;; esac
            done
            exit 0
          fi
          mapfile -t names < <("$bin/addontest" --list --format terse | sed -n 's/: test$//p' | awk -v k="$SHARD" 'NR % 3 == k % 3')
          echo "addontest: ${#names[@]} tests in shard $SHARD"
          test "${#names[@]}" -gt 0
          "$bin/addontest" --exact "${names[@]}"

  # The required check. It runs whatever the lane job did, so it always reports: it fails when the lane
  # job did not finish or a job its lane runs did not pass, and passes at once when the lane is skip.
  check:
    name: Format, lints, tests
    needs: [lane, rust, addontest-bin, addontest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lane
        working-directory: .
        env:
          LANE: ${{ needs.lane.result }}
          FORGE: ${{ needs.lane.outputs.forge }}
          RUST: ${{ needs.rust.result }}
          BIN: ${{ needs.addontest-bin.result }}
          ADDON: ${{ needs.addontest.result }}
        run: |
          if [ "$LANE" != success ]; then echo "::error::The Forge lane job did not finish ($LANE)."; exit 1; fi
          bad=0
          need() { if [ "$2" != success ]; then echo "::error::$1: $2"; bad=1; fi; }
          case "$FORGE" in
            skip)
              echo "No path the Rust and Lua suites read changed: nothing to run."
              printf '## Format, lints, tests: skipped\n\nNo path the suites read changed (tools/ci-lane.js, FORGE_PATHS).\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            addon)
              need "Addon tests build" "$BIN"
              need "Addon tests" "$ADDON"
              printf '## Format, lints, tests: the Lua tests\n\nNo Rust changed: the Rust suites, MSRV and wasm32 are skipped.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              need "Rust suites" "$RUST"
              need "Addon tests build" "$BIN"
              need "Addon tests" "$ADDON"
              ;;
          esac
          exit "$bad"

  msrv:
    name: Minimum Rust version
    needs: lane
    if: needs.lane.outputs.forge == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The rust-version rust/Cargo.toml declares.
      - name: Toolchain
        id: rv
        run: |
          rv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$rv"
          rustup toolchain install "$rv" --profile minimal
          echo "version=$rv" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: msrv

      - name: Check
        run: cargo +${{ steps.rv.outputs.version }} check --locked --workspace

  wasm:
    name: wasm32 build
    needs: lane
    if: needs.lane.outputs.forge == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: wasm32

      # Every crate but the native-only ones (forge and forge-data: vendored Lua, the client
      # install), without their `native` feature.
      - name: Check
        run: >-
          cargo check --locked --target wasm32-unknown-unknown --no-default-features --lib
          -p forge-core -p forge-guide -p forge-world -p forge-sim -p forge-nav -p forge-judge
          -p forge-writer -p forge-gamedata -p forge-wasm

      # The browser planner's package (forge-wasm's wasm-bindgen glue, wasm-opt), as www-build/build.sh
      # makes it; the page itself needs local data and is not built here.
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack --version 0.15.1

      - name: wasm-pack
        working-directory: rust/crates/forge-wasm
        run: wasm-pack build --release --target web --out-dir www/pkg --no-typescript

  build:
    name: Build ${{ matrix.name }}
    needs: check
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: "" }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, exe: "" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # The release's version is the workspace's (rust/Cargo.toml).
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/forge-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#forge-v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$want" != "$have" ]; then echo "tag $GITHUB_REF_NAME but rust/Cargo.toml says $have"; exit 1; fi

      - name: Build
        shell: bash
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --bin forge

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.3

      # The licences of every Rust dependency built into this target's binary.
      - name: Dependency licences
        shell: bash
        run: cargo about generate --locked --target ${{ matrix.target }} -m crates/forge/Cargo.toml about.hbs -o THIRD_PARTY_RUST.md

      - name: Package
        shell: bash
        run: |
          dir="polestar-forge-${{ matrix.name }}"
          mkdir -p "$dir"
          # one binary: forge build, plus forge data | doctor | gamedata | guide | judge | nav | sim | walks | writer
          cp "target/${{ matrix.target }}/release/forge${{ matrix.exe }}" "$dir/"
          cp ../LICENSE ../LICENSE-EXCEPTION.md NOTICE.md ../THIRD_PARTY.md THIRD_PARTY_RUST.md "$dir/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polestar-forge-${{ matrix.name }}
          path: rust/polestar-forge-${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/forge-v')
    needs: [check, msrv, wasm, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Archive
        working-directory: dist
        run: |
          for d in polestar-forge-*/; do
            d="${d%/}"
            if [ -f "$d/forge" ]; then chmod +x "$d/forge"; fi
            if [[ "$d" == *windows* ]]; then zip -qr "$d.zip" "$d"; else tar -czf "$d.tar.gz" "$d"; fi
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          # The addon's own release stays the repository's latest (its download links and the
          # data pack's fixed `data-pack` release do not move).
          make_latest: false
