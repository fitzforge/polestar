name: Client

# Polestar Client (apps/client) on every pull request and push that touches it or the library it
# builds on: a Linux release build, launched once (apps/client/release/smoke.sh: POLESTAR_SMOKE
# on a virtual display, src-tauri/src/smoke.rs). The job fails when the window shows its fault
# page or never loads, so a client that cannot open never reaches a release (0.1.1 opened on
# an error on some Linux desktops). push and pull_request only, no secrets, read-only token.
# client.yml runs the same test on the release builds.
on:
  push:
    branches: [main, next]
    paths: ["apps/client/**", "rust/crates/polestar-recording/**", ".github/workflows/client-check.yml"]
  pull_request:
    paths: ["apps/client/**", "rust/crates/polestar-recording/**", ".github/workflows/client-check.yml"]

permissions:
  contents: read

concurrency:
  group: client-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  launch:
    name: Client launch test (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The build's libraries (as in client.yml), and a virtual display to launch it on.
      - name: Linux libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf xvfb

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/client/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/client/src-tauri

      # No lifecycle scripts: the bundler's native parts come as optional packages.
      - name: Frontend dependencies
        working-directory: apps/client
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The release binary with the frontend built in, as the installers ship it (no installers,
      # so no updater files to sign).
      - name: Build
        working-directory: apps/client
        run: pnpm tauri build --no-bundle --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Launch test
        run: apps/client/release/smoke.sh apps/client/src-tauri/target/release/polestar-client 15
