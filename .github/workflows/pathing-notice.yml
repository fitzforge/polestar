name: Pathing reports

# A player's report about the walk, path or arrow route (or any issue a
# maintainer labels `navigation`): label it navigation + on-hold and tell the
# player, on the issue and in their Discord thread, that the pathing overhaul
# will most likely fix it. Once per issue. tools/discord-bot/lib/pathing.js
# decides what counts.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: pathing-issue-${{ github.event.issue.number }}

jobs:
  notice:
    name: Pathing note
    if: github.event.action == 'opened' || github.event.label.name == 'navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/discord-bot
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Note
        run: node tools/discord-bot/notify.js pathing
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_FORUM_ID: ${{ vars.DISCORD_FORUM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
