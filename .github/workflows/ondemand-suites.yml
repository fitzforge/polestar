name: On-demand suites

# The full test suites on any branch or commit, started by hand (one run per batch of work, not per
# commit) or from ondemand-batch.yml: what ci.yml and forge.yml's check job run on a pull request,
# for a branch that has none yet. The Node suite in four shards, the Rust workspace (format, lints,
# tests and the documented commands) without the addon's Lua tests, those tests (forge-addontest) in
# a job of their own, and CI's changelog, translations and previews checks.
#
# data: none (the default) runs them as CI does: the tests that read data/forever skip with a reason.
# data: public builds data/forever from public sources first (.github/actions/public-data: no
# QuestieDB, no recordings, no private corrections), so those tests run too, against reduced data:
# a failure there counts when the same run on the base passes, or when it is about the change
# itself. The release data (forge data build --kb) stays local, and so do the release gates run on it.
#
# GitHub dispatches a workflow only when the file is on the default branch (next): this one can be
# run once it is merged there. `ref` picks the code to test, so a branch without this file is tested
# too, as long as it is pushed to GitHub:
#   gh workflow run ondemand-suites.yml --ref next -f ref=<branch or sha> -f data=public
# docs/CI.md has the details and what stays local. Nothing here needs a secret or writes anywhere.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (empty = the branch the run was started on)
        type: string
        default: ""
      data:
        description: "none: data tests skip, as in CI; public: build data/forever from public sources first"
        type: choice
        options: [none, public]
        default: none
      node:
        description: Node suite (npm test, four shards)
        type: boolean
        default: true
      rust:
        description: Rust workspace (fmt, clippy, tests without forge-addontest, documented commands)
        type: boolean
        default: true
      addontest:
        description: The addon's Lua tests (forge-addontest)
        type: boolean
        default: true
      checks:
        description: Changelog fragments, translations, previews
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      data:
        type: string
        default: none
      node:
        type: boolean
        default: true
      rust:
        type: boolean
        default: true
      addontest:
        type: boolean
        default: true
      checks:
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # forge for the Node tests (tests/helpers/cli.js, $FORGE) and, with data: public, data/forever;
  # both go to the jobs below through the Actions cache (never an artifact: the data stays private
  # to this repository's runs).
  prep:
    name: forge and data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Inputs
        env:
          REF: ${{ inputs.ref || github.ref }}
          DATA: ${{ inputs.data }}
        run: |
          case "$DATA" in none|public) ;; *) echo "::error::data must be none or public"; exit 1 ;; esac
          echo "ref: $REF, data: $DATA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Commit
        run: echo "commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: ci

      - name: Build forge
        working-directory: rust
        run: cargo build --profile quick --locked -p forge

      # The public-data action from this workflow's own commit: the code under test (ref) may predate it.
      - name: Workflow's actions
        if: inputs.data == 'public'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: .ondemand
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Public data
        if: inputs.data == 'public'
        uses: ./.ondemand/.github/actions/public-data
        with:
          forge: ${{ github.workspace }}/rust/target/quick/forge

      # Without data: public there is no data/forever, as in CI (the cache keeps only the binary).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/quick/forge
            data/forever
          key: ondemand-suites-${{ github.run_id }}-${{ github.run_attempt }}

  node:
    name: Node suite ${{ matrix.shard }}/4
    needs: prep
    if: inputs.node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/quick/forge
            data/forever
          key: ondemand-suites-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      # Without data/forever the tests that read it skip, naming the missing file. With it, two files at
      # a time: a large guide or sim test holds 2-3 GB.
      - name: Test
        env:
          FORGE: ${{ github.workspace }}/rust/target/quick/forge
        run: >-
          node --test --test-shard=${{ matrix.shard }}/4
          --test-concurrency=${{ inputs.data == 'public' && 2 || 3 }} "tests/**/*.test.js"

  rust:
    name: Rust workspace
    needs: prep
    if: inputs.rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/quick/forge
            data/forever
          key: ondemand-suites-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --profile quick --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --profile quick --workspace --locked --exclude forge-addontest

      - name: Documented commands
        if: ${{ !cancelled() }}
        run: |
          cargo build --profile quick --locked -p forge
          scripts/doc-commands.sh target/quick/forge

  addontest:
    name: Addon tests (forge-addontest)
    needs: prep
    if: inputs.addontest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: addontest

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/quick/forge
            data/forever
          key: ondemand-suites-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Test
        run: cargo test --profile quick --locked -p forge-addontest

  checks:
    name: Changelog, translations, previews
    needs: prep
    if: inputs.checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/quick/forge
            data/forever
          key: ondemand-suites-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Changelog fragments
        run: rust/target/quick/forge changelog check --root .

      - name: Translations
        if: ${{ !cancelled() }}
        run: rust/target/quick/forge i18n check --root .

      - name: Previews build clean
        if: ${{ !cancelled() }}
        run: node tools/polestar.js preview
