name: PR base

# Every pull request goes to `next`. `main` is never a base: it moves only
# when a release is made. The maintainers' `release/<version>` (a release
# being tested, cut from next), `hotfix/<version>` (an urgent fix, cut from
# the live release's tag) and `feature/<name>` (a large feature not ready
# for next yet) are bases too. See CONTRIBUTING.md, "Branches", and
# docs/RELEASING.md.
#
# This runs on pull_request_target so it is a required check for forks too.
# It never checks out or runs the pull request's code: the public-text job
# runs the base branch's own check, and the commit authors are read through
# the API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# Each job asks for what it reads.
permissions: {}

concurrency:
  group: pr-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base:
    # Base branch is a check next requires, so the commit authors' check sits in this job: a failure stops a
    # merge, an automatic one included.
    name: Base branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      # Every commit's author and committer email is a GitHub noreply address (<id>+<name>@users.noreply.github.com,
      # GitHub's "Keep my email addresses private"; noreply@github.com commits made on the website). A pushed
      # commit's email is public for good. The failure names the commit and which email, never the address.
      - name: Commit authors
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          list=$RUNNER_TEMP/emails.tsv
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | [.sha[0:12], (.commit.author.email // ""), (.commit.committer.email // "")] | @tsv' > "$list"
          bad=$(awk -F'\t' '{
            for (i = 2; i <= 3; i++) {
              e = tolower($i)
              if (e !~ /@users\.noreply\.github\.com$/ && e != "noreply@github.com") print $1 " " (i == 2 ? "author" : "committer")
            }
          }' "$list")
          if [ -n "$bad" ]; then
            msg="Every commit's author and committer email must be a GitHub noreply address (GitHub Settings, Emails, \"Keep my email addresses private\" shows yours). Set it with git config user.email, rewrite the branch's commits (git rebase --exec 'git commit --amend --no-edit --reset-author' followed by the branch it merges into) and force-push (CONTRIBUTING.md, \"Commits and pull requests\")."
            while read -r sha who; do echo "::error::Commit $sha: the $who email is not a GitHub noreply address."; done <<< "$bad"
            echo "::error::$msg"
            {
              echo '## Commit authors'
              echo
              echo "$msg"
              echo
              sed 's/^/- /' <<< "$bad"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo '## Commit authors'
            echo
            echo "All $(wc -l < "$list") commit(s) have GitHub noreply author and committer emails."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Not main
        if: github.event.pull_request.base.ref == 'main'
        run: |
          msg="Pull requests never go to main, which moves only when a release is made. Change the base to next (CONTRIBUTING.md, \"Branches\")."
          echo "::error::$msg"
          {
            echo '## Base branch: main'
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Not something else
        if: github.event.pull_request.base.ref != 'main' && github.event.pull_request.base.ref != 'next' && !startsWith(github.event.pull_request.base.ref, 'release/') && !startsWith(github.event.pull_request.base.ref, 'hotfix/') && !startsWith(github.event.pull_request.base.ref, 'feature/')
        run: |
          msg="Pull requests go to next. Change the base to next (CONTRIBUTING.md, \"Branches\")."
          echo "::error::$msg"
          {
            echo "## Base branch: $BASE"
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Next, a release, hotfix or feature branch
        if: github.event.pull_request.base.ref == 'next' || startsWith(github.event.pull_request.base.ref, 'release/') || startsWith(github.event.pull_request.base.ref, 'hotfix/') || startsWith(github.event.pull_request.base.ref, 'feature/')
        run: |
          {
            echo "## Base branch: $BASE"
            echo
            echo "Nothing to check for this base."
          } >> "$GITHUB_STEP_SUMMARY"

  generated:
    # The leveling guides are written by Polestar Forge on the maintainer's machine and listed in
    # guides/GENERATED.json; forge/seed is what Forge starts from. tests/generated-guides.test.js
    # fails a hand edit to a listed guide; this fails a pull request that changes the list or the
    # seed, so the two cannot be edited together. docs/FORGE.md, "Fixing a generated guide".
    name: Generated guides
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Not the manifest or the seed
        run: |
          bad=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -E '^(guides/GENERATED\.json|forge/seed/)' || true)
          if [ -n "$bad" ]; then
            msg="This pull request changes files only forge build writes: $(echo $bad). A fix goes into forever-db/corrections, data/mechanics-public.json, data/route-fixes.json, data/places.json (arrow points) or data/guide-fixes.json (tips, gates, when), with its test, and the next build applies it (docs/FORGE.md, \"Fixing a generated guide\")."
            echo "::error::$msg"
            {
              echo '## Generated guides'
              echo
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## Generated guides' >> "$GITHUB_STEP_SUMMARY"
          echo 'No generated manifest or seed file changed.' >> "$GITHUB_STEP_SUMMARY"

  public-text:
    # Titles, descriptions, branch names and commit messages are public for good: a pushed commit stays
    # readable by its SHA after a force-push. tools/public-text.js holds them to the rules in
    # tools/lib/public-text.json (CONTRIBUTING.md, "Commits and pull requests") and prints only which
    # rule a line breaks, never the words. The text reaches the script through the environment, never
    # the shell.
    name: Public text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            tools/public-text.js
            tools/lib/public-text.js
            tools/lib/public-text.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Title, description, branch name and commit messages
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | {sha: .sha, message: .commit.message} | @json' > "$RUNNER_TEMP/commits.jsonl"
          node tools/public-text.js --pr --commits "$RUNNER_TEMP/commits.jsonl"
          echo '## Public text' >> "$GITHUB_STEP_SUMMARY"
          echo 'The title, description, branch name and commit messages follow the public-text rule.' >> "$GITHUB_STEP_SUMMARY"
