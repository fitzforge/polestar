name: PR base

# Every pull request goes to `next`. `main` is never a base: it moves only
# when a release is made (fast-forward to `next`, then tagged). See
# CONTRIBUTING.md, "Branches".
#
# This runs on pull_request_target so it is a required check for forks too.
# It never checks out or runs the pull request's code: the public-text job
# runs the base branch's own check.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# Each job asks for what it reads.
permissions: {}

concurrency:
  group: pr-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base:
    name: Base branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Not main
        if: github.event.pull_request.base.ref == 'main'
        run: |
          msg="Pull requests never go to main, which moves only when a release is made. Change the base to next (CONTRIBUTING.md, \"Branches\")."
          echo "::error::$msg"
          {
            echo '## Base branch: main'
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Not something else
        if: github.event.pull_request.base.ref != 'main' && github.event.pull_request.base.ref != 'next'
        run: |
          msg="Pull requests go to next. Change the base to next (CONTRIBUTING.md, \"Branches\")."
          echo "::error::$msg"
          {
            echo "## Base branch: $BASE"
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Next
        if: github.event.pull_request.base.ref == 'next'
        run: |
          {
            echo "## Base branch: $BASE"
            echo
            echo "Nothing to check for this base."
          } >> "$GITHUB_STEP_SUMMARY"

  generated:
    # The leveling guides are written by Polestar Forge on the maintainer's machine and listed in
    # guides/GENERATED.json; forge/seed is what Forge starts from. tests/generated-guides.test.js
    # fails a hand edit to a listed guide; this fails a pull request that changes the list or the
    # seed, so the two cannot be edited together. docs/FORGE.md, "Fixing a generated guide".
    name: Generated guides
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Not the manifest or the seed
        run: |
          bad=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -E '^(guides/GENERATED\.json|forge/seed/)' || true)
          if [ -n "$bad" ]; then
            msg="This pull request changes files only forge build writes: $(echo $bad). A fix goes into forever-db/corrections, data/mechanics-public.json or data/route-fixes.json, and the next build applies it (docs/FORGE.md, \"Fixing a generated guide\")."
            echo "::error::$msg"
            {
              echo '## Generated guides'
              echo
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## Generated guides' >> "$GITHUB_STEP_SUMMARY"
          echo 'No generated manifest or seed file changed.' >> "$GITHUB_STEP_SUMMARY"

  public-text:
    # Titles, descriptions, branch names and commit messages are public for good: a pushed commit stays
    # readable by its SHA after a force-push. tools/public-text.js holds them to the rules in
    # tools/lib/public-text.json (CONTRIBUTING.md, "Commits and pull requests") and prints only which
    # rule a line breaks, never the words. The text reaches the script through the environment, never
    # the shell.
    name: Public text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            tools/public-text.js
            tools/lib/public-text.js
            tools/lib/public-text.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Title, description, branch name and commit messages
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | {sha: .sha, message: .commit.message} | @json' > "$RUNNER_TEMP/commits.jsonl"
          node tools/public-text.js --pr --commits "$RUNNER_TEMP/commits.jsonl"
          echo '## Public text' >> "$GITHUB_STEP_SUMMARY"
          echo 'The title, description, branch name and commit messages follow the public-text rule.' >> "$GITHUB_STEP_SUMMARY"
