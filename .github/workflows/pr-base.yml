name: PR base

# Every pull request goes to `next`. `main` is never a base: it moves only
# when a release is made. The maintainers' `release/<version>` (a release
# being tested, cut from next), `hotfix/<version>` (an urgent fix, cut from
# the live release's tag) and `feature/<name>` (a large feature not ready
# for next yet) are bases too. See CONTRIBUTING.md, "Branches", and
# docs/RELEASING.md.
#
# This runs on pull_request_target so it is a required check for forks too.
# It never checks out or runs the pull request's code: the public-text job
# runs the base branch's own check, and the commit authors are read through
# the API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# Each job asks for what it reads.
permissions: {}

concurrency:
  group: pr-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base:
    # Base branch is a check next requires, so the commit email check sits in this job: a failure stops a merge,
    # an automatic one included.
    name: Base branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      # The maintainers' commits carry the account's GitHub noreply address (<id>+<login>@users.noreply.github.com;
      # noreply@github.com for a commit GitHub makes on the website): a pushed commit's email is public for good.
      # A commit side (author or committer) is the maintainers' when GitHub links it to the repository owner's
      # account or its name is the owner's commit name. An address on the deny list (SHA-256 of the lowercased
      # address; the address itself is never stored here) fails whatever name it carries. Contributors' own
      # addresses are theirs to choose and are not checked. A failure names the commit and the side, never the
      # address. Fields are split on the unit separator: an empty field (a commit GitHub links to no account) keeps
      # its place.
      - name: Commit emails
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          OWNER_NAME: Fitz
          DENY_SHA256: 37704005b54e643f71e0fd97f375d1f004fc797dd6958a9ca5856ef4cf03ba11
        run: |
          list=$RUNNER_TEMP/commits.txt
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | [.sha[0:12], (.author.login // ""), (.commit.author.name // ""), (.commit.author.email // ""), (.committer.login // ""), (.commit.committer.name // ""), (.commit.committer.email // "")] | join("\u001f")' > "$list"
          ours=$(printf '%s+%s@users.noreply.github.com' "$OWNER_ID" "$OWNER" | tr '[:upper:]' '[:lower:]')
          bad=
          while IFS=$'\x1f' read -r sha alogin aname aemail clogin cname cemail; do
            for side in author committer; do
              if [ "$side" = author ]; then login=$alogin name=$aname email=$aemail; else login=$clogin name=$cname email=$cemail; fi
              email=$(printf '%s' "$email" | tr '[:upper:]' '[:lower:]')
              hash=$(printf '%s' "$email" | sha256sum | cut -c1-64)
              if [[ " $DENY_SHA256 " == *" $hash "* ]]; then
                bad+="$sha $side"$'\n'
              elif [ "${login,,}" = "${OWNER,,}" ] || [ "$name" = "$OWNER_NAME" ]; then
                [ "$email" = "$ours" ] || [ "$email" = noreply@github.com ] || bad+="$sha $side"$'\n'
              fi
            done
          done < "$list"
          bad=${bad%$'\n'}
          if [ -n "$bad" ]; then
            msg="A commit made as the maintainers' account carries an address other than the account's GitHub noreply one. Set git config user.email to the noreply address, rewrite the branch's commits (git rebase --exec 'git commit --amend --no-edit --reset-author' followed by the branch it merges into) and force-push."
            while read -r sha side; do echo "::error::Commit $sha: the $side email is not the account's GitHub noreply address."; done <<< "$bad"
            echo "::error::$msg"
            {
              echo '## Commit emails'
              echo
              echo "$msg"
              echo
              sed 's/^/- /' <<< "$bad"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo '## Commit emails'
            echo
            echo "None of the $(wc -l < "$list") commit(s) carries a private address of the maintainers' account."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Not main
        if: github.event.pull_request.base.ref == 'main'
        run: |
          msg="Pull requests never go to main, which moves only when a release is made. Change the base to next (CONTRIBUTING.md, \"Branches\")."
          echo "::error::$msg"
          {
            echo '## Base branch: main'
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Not something else
        if: github.event.pull_request.base.ref != 'main' && github.event.pull_request.base.ref != 'next' && !startsWith(github.event.pull_request.base.ref, 'release/') && !startsWith(github.event.pull_request.base.ref, 'hotfix/') && !startsWith(github.event.pull_request.base.ref, 'feature/')
        run: |
          msg="Pull requests go to next. Change the base to next (CONTRIBUTING.md, \"Branches\")."
          echo "::error::$msg"
          {
            echo "## Base branch: $BASE"
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Next, a release, hotfix or feature branch
        if: github.event.pull_request.base.ref == 'next' || startsWith(github.event.pull_request.base.ref, 'release/') || startsWith(github.event.pull_request.base.ref, 'hotfix/') || startsWith(github.event.pull_request.base.ref, 'feature/')
        run: |
          {
            echo "## Base branch: $BASE"
            echo
            echo "Nothing to check for this base."
          } >> "$GITHUB_STEP_SUMMARY"

  generated:
    # The leveling guides are written by Polestar Forge on the maintainer's machine and listed in
    # guides/GENERATED.json; forge/seed is what Forge starts from. tests/generated-guides.test.js
    # fails a hand edit to a listed guide; this fails a pull request that changes the list or the
    # seed, so the two cannot be edited together. docs/FORGE.md, "Fixing a generated guide".
    name: Generated guides
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Not the manifest or the seed
        run: |
          bad=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -E '^(guides/GENERATED\.json|forge/seed/)' || true)
          if [ -n "$bad" ]; then
            msg="This pull request changes files only forge build writes: $(echo $bad). A fix goes into forever-db/corrections, data/mechanics-public.json, data/route-fixes.json, data/places.json (arrow points) or data/guide-fixes.json (tips, gates, when), with its test, and the next build applies it (docs/FORGE.md, \"Fixing a generated guide\")."
            echo "::error::$msg"
            {
              echo '## Generated guides'
              echo
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## Generated guides' >> "$GITHUB_STEP_SUMMARY"
          echo 'No generated manifest or seed file changed.' >> "$GITHUB_STEP_SUMMARY"

  public-text:
    # Titles, descriptions, branch names and commit messages are public for good: a pushed commit stays
    # readable by its SHA after a force-push. tools/public-text.js holds them to the rules in
    # tools/lib/public-text.json (CONTRIBUTING.md, "Commits and pull requests") and prints only which
    # rule a line breaks, never the words. The text reaches the script through the environment, never
    # the shell.
    name: Public text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            tools/public-text.js
            tools/lib/public-text.js
            tools/lib/public-text.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Title, description, branch name and commit messages
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | {sha: .sha, message: .commit.message} | @json' > "$RUNNER_TEMP/commits.jsonl"
          node tools/public-text.js --pr --commits "$RUNNER_TEMP/commits.jsonl"
          echo '## Public text' >> "$GITHUB_STEP_SUMMARY"
          echo 'The title, description, branch name and commit messages follow the public-text rule.' >> "$GITHUB_STEP_SUMMARY"
