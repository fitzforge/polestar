name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its older run. Pushes to main and next
# run to the end, so every merge commit gets a result and a run of merges
# shows which one broke the branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      # The guide, data and release commands are forge's (rust/): build it
      # first, so the Node tests that run it (tests/helpers/cli.js, $FORGE)
      # run instead of skipping. The quick profile: release without LTO.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: ci

      - name: Build forge
        working-directory: rust
        run: |
          cargo build --profile quick --locked -p forge
          echo "FORGE=$GITHUB_WORKSPACE/rust/target/quick/forge" >> "$GITHUB_ENV"

      # A fresh clone has no built data (it needs the game client and local
      # sources), so the tests that read it skip with a reason.
      - name: Test
        run: npm test

      # Every changelog fragment in changes/ has a section and an entry, and
      # CHANGELOG.md has no "Unreleased" section of its own.
      - name: Changelog fragments
        run: $FORGE changelog check --root .

      # The interface translations: every locale file loads, no stale key, no
      # broken format; glossary drift only warns. The forge-i18n tests check
      # the same; this step prints each language's counts and warnings.
      - name: Translations
        run: $FORGE i18n check --root .

      # The textures are generated from code alone, so CI rebuilds them to
      # verify the generators work. Committed copies are kept fresh by the
      # maintainer after merging PRs that touch tools/media (polestar regen).
      - name: Textures build clean
        run: node tools/polestar.js media

      # The UI renders are generated from the addon's Lua and frozen fixtures
      # (no reference data, no shipped guides). CI renders them to verify the
      # renderer works. Committed SVGs are kept fresh by the maintainer after
      # merging UI PRs (polestar regen). A UI change never requires a guide
      # recompile; a guide change never affects these renders.
      - name: Previews build clean
        run: node tools/polestar.js preview
