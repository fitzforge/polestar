# The workflows pin every action by commit SHA (with the version in a comment): this keeps the
# pins current. One grouped pull request a week, to next.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
